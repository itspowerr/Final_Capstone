services:
  postgres:
    image: postgres:15
    container_name: freeledger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: freeledger
      POSTGRES_USER: freeledger
      POSTGRES_PASSWORD: freeledger_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeledger"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - dokploy-network

  redis:
    image: redis:7
    container_name: freeledger-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - dokploy-network

  hardhat:
    image: node:20
    container_name: freeledger-hardhat
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8545:8545"
    volumes:
      - ../contracts:/app
      - hardhat_data:/app/data
    command: sh /app/docker-entrypoint.sh
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.hardhat.rule=Host(`hardhat.poudel-pawan.com.np`)
      - traefik.http.routers.hardhat.entrypoints=websecure
      - traefik.http.routers.hardhat.tls.certresolver=letsencrypt
      - traefik.http.services.hardhat.loadbalancer.server.port=8545
    healthcheck:
      test: ["CMD-SHELL", "curl -s -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' http://localhost:8545 | grep -q '\"result\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - dokploy-network

  ipfs:
    image: ipfs/kubo:v0.28.0
    container_name: freeledger-ipfs
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
      - ./ipfs/config.sh:/container-init.d/002-config.sh:ro
    environment:
      IPFS_PROFILE: server
    healthcheck:
      test: ["CMD-SHELL", "ipfs swarm peers > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - dokploy-network

volumes:
  postgres_data:
  redis_data:
  ipfs_data:
  hardhat_data:

networks:
  dokploy-network:
    external: true
